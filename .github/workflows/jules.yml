name: Jules AI Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  jules-task:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'Jules'
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            You are working on the NivWest backend — a Go API using Gin, GORM, and PostgreSQL.

            ## Issue to implement
            **Title:** ${{ github.event.issue.title }}
            **Number:** #${{ github.event.issue.number }}
            **Body:**
            ${{ github.event.issue.body }}

            ## Instructions

            1. **Read the issue carefully** and understand the full requirement.
            2. **Read the documentation** in `AGENTS.md`, `doc/architecture.md`, and `doc/workflow.md` before making changes. Ensure you adhere to all architectural patterns, dependency inversion rules, and testing guidelines.
            3. **Determine the type of change:**
               - Bug fix → branch from `dev` as `jules/fix/<issue-number>-<short-slug>`
               - New feature → branch from `dev` as `jules/feat/<issue-number>-<short-slug>`
               - Refactor → branch from `dev` as `jules/refactor/<issue-number>-<short-slug>`
               - Chore/docs → branch from `dev` as `jules/chore/<issue-number>-<short-slug>`
            4. **Implement the change and tests**. Verify that your code is covered by tests using in-memory fakes.
            5. **Write clean, atomic commits** with conventional commit messages (e.g. `feat(scope): ...`, `fix(scope): ...`).
            6. **Run `gofmt -w cmd internal`, `go test ./...`, and `go build ./cmd/api`** to ensure the code passes checks.
            7. **Open a pull request** targeting `dev` with:
               - A clear title prefixed with the conventional type (e.g., `feat(stocks): add watchlist endpoint`)
               - A description summarising what was changed and why
               - Reference `Closes #${{ github.event.issue.number }}` in the PR body
          starting_branch: dev
