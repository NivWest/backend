name: Agent Implement

# A human adds the `agent-delegate` label to a sub-issue of a Jira-linked
# issue. The sub-issue only needs to say what should change; Jules works out
# the files, acceptance criteria and tests from the code, the repo docs and the
# parent user story, then opens a PR against dev.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.label.name == 'agent-delegate'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      jira_key: ${{ steps.check.outputs.jira_key }}
      jira_url: ${{ steps.check.outputs.jira_url }}
      parent_title: ${{ steps.check.outputs.parent_title }}
      parent_url: ${{ steps.check.outputs.parent_url }}
      story: ${{ steps.check.outputs.story }}
      task: ${{ steps.check.outputs.task }}
      hints: ${{ steps.check.outputs.hints }}
    steps:
      - name: Check Definition of Ready
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const body = (issue.body || '').replace(/<!--[\s\S]*?-->/g, '');

            // The Agent task form renders "### Task" and "### Hints"; a plain body counts as the task.
            function section(label) {
              const re = new RegExp(`^###\\s+${label}\\s*$([\\s\\S]*?)(?=^###\\s|(?![\\s\\S]))`, 'm');
              const text = (body.match(re)?.[1] || '').replace(/^```\w*\s*$/gm, '').trim();
              return text === '_No response_' ? '' : text;
            }
            const fromForm = /^###\s+Task\s*$/m.test(body);
            const task = fromForm ? section('Task') : body.trim();
            const hints = fromForm ? section('Hints') : '';

            const missing = [];
            if (task.length < 15) {
              missing.push('Describe **what should change** in a sentence or two. Jules works out the files, the approach and the tests.');
            }

            let parent = null;
            try {
              ({ data: parent } = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/parent', {
                owner, repo, issue_number: issue.number,
              }));
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const jiraKey = parent?.title.match(/^([A-Z][A-Z0-9]+-\d+)\b/)?.[1] || '';
            if (!parent) {
              missing.push('This issue is not a **sub-issue**. Add it as a sub-issue of the Jira-linked issue (`SCRUM-xx: …`).');
            } else if (!jiraKey) {
              missing.push(`Parent issue ${parent.html_url} has no Jira key at the start of its title.`);
            }

            if (missing.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  '🤖 Not delegated to Jules. This task does not meet the Definition of Ready yet:',
                  '',
                  ...missing.map(m => `- ${m}`),
                  '',
                  'Fix the above, then add the `agent-delegate` label again.',
                ].join('\n'),
              });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'agent-delegate',
              }).catch(() => {});
              core.setOutput('ready', 'false');
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            // Jules opens PRs under the API key owner's account, not a bot, so detect them by the footer it adds.
            const mentions = new RegExp(`#${issue.number}\\b`);
            const existing = pulls.find(p => (p.body || '').includes('PR created automatically by Jules') && mentions.test(p.body));
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🤖 Not delegated again: Jules already has an open PR for this task (#${existing.number}).`,
              });
              core.setOutput('ready', 'false');
              return;
            }

            // The user story is the Jira description mirrored into the parent, before the sync footer.
            const story = (parent.body || '').split(/\n---\n/)[0].trim().slice(0, 4000);

            core.setOutput('ready', 'true');
            core.setOutput('jira_key', jiraKey);
            core.setOutput('jira_url', parent.body?.match(/\*\*Jira:\*\*\s*(\S+)/)?.[1] || jiraKey);
            core.setOutput('parent_title', parent.title);
            core.setOutput('parent_url', parent.html_url);
            core.setOutput('story', story || 'None');
            core.setOutput('task', task);
            core.setOutput('hints', hints || 'None');

  implement:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      # Calls the Jules API directly instead of google-labs-code/jules-invoke,
      # which ignores API errors and always appends the git log to the prompt.
      - name: Start Jules session
        id: jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          STARTING_BRANCH: dev
          PROMPT: |
            You are working on the NivWest backend — a Go API using Gin, GORM, and PostgreSQL.

            ## Context
            - Jira ticket: ${{ needs.gate.outputs.jira_key }} (${{ needs.gate.outputs.jira_url }})
            - Parent issue: ${{ needs.gate.outputs.parent_title }} (${{ needs.gate.outputs.parent_url }})
            - Your task: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}

            ## User story (from the parent issue)
            ${{ needs.gate.outputs.story }}

            ## Task
            ${{ needs.gate.outputs.task }}

            ## Hints from the developer
            ${{ needs.gate.outputs.hints }}

            ## How to work
            The task is deliberately short. Work out the details yourself:
            1. Read `AGENTS.md`, `doc/architecture.md` and `doc/workflow.md` before making changes, and follow them.
            2. Investigate the code to find where the change belongs, and keep it in the right layer
               (handlers → services → domain → repositories).
            3. Before coding, decide the acceptance criteria from the task and the user story, including edge cases
               such as invalid input, empty results and upstream errors.
            4. Make the smallest change that delivers the task. Do not refactor unrelated code or change files
               the task does not need.
            5. Cover every acceptance criterion with tests that use the in-memory fakes from `internal/testutil`.
            6. Run these and fix every failure before opening the PR:
               `gofmt -l cmd internal` (must print nothing), `go vet ./...`, `go test ./...`, `go build ./cmd/api`.
            7. If something is ambiguous, choose the simplest reasonable interpretation and record it as an assumption.
            8. Branch from `dev` as `jules/<type>/${{ needs.gate.outputs.jira_key }}-<short-slug>`, where `<type>` is
               `feat`, `fix`, `refactor` or `chore`. Use Conventional Commits and end each subject with
               `[${{ needs.gate.outputs.jira_key }}]`.
            9. Open exactly one pull request targeting `dev`:
               - Title: `${{ needs.gate.outputs.jira_key }} <type>(<scope>): <summary>`
               - Body sections: **Summary**, **Acceptance criteria** (the ones you chose, as a checklist),
                 **Files changed** (one line each, with why), **Assumptions**, **Verification** (commands and results).
               - End the body with `Closes #${{ github.event.issue.number }}` and `Jira: ${{ needs.gate.outputs.jira_url }}`.
        run: |
          set -euo pipefail
          jq -n --arg prompt "$PROMPT" --arg branch "$STARTING_BRANCH" --arg repo "$GITHUB_REPOSITORY" '{
            prompt: $prompt,
            sourceContext: {source: "sources/github/\($repo)", githubRepoContext: {startingBranch: $branch}},
            requirePlanApproval: false,
            automationMode: "AUTO_CREATE_PR"
          }' > payload.json
          curl -sS --fail-with-body https://jules.googleapis.com/v1alpha/sessions \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -d @payload.json > session.json
          url=$(jq -r '.url' session.json)
          echo "Jules session: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report delegation on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.jules.outcome }}
          SESSION_URL: ${{ steps.jules.outputs.url }}
          JIRA_KEY: ${{ needs.gate.outputs.jira_key }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            if (process.env.OUTCOME === 'success') {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `🤖 Delegated to Jules for \`${process.env.JIRA_KEY}\`: ${process.env.SESSION_URL}\n` +
                      'Jules will open a PR against `dev` that closes this issue.',
              });
            } else {
              const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `🤖 Could not start a Jules session (${run}). Add the \`agent-delegate\` label again to retry.`,
              });
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'agent-delegate' }).catch(() => {});
            }
