openapi: 3.1.0
info:
  title: TradeEdu API
  version: 0.0.0
  summary: Virtual stock trading simulator API (NivWest backend).
  description: |
    Cross-repo source of truth for the NivWest backend API. Each story adds its paths here in its contract step.
    The backend serves this file at `GET /api/v1/openapi.yaml` and an interactive reference at `GET /api/docs`.
    A route parity test (`internal/handlers/openapi_parity_test.go`) fails when a mounted route is missing here or a
    path here has no route, and the frontend generates its types from a vendored copy (`npm run api:gen`).

    Errors use the `Error` schema: `{"error": "<human message>", "code": "<ErrorCode>"}`.

    `info.version` always equals the backend's `VERSION` file (enforced by `api/spec_test.go`).
servers:
  - url: /api/v1
    description: This deployment

tags:
  - name: Meta
    description: Health and this contract.
  - name: Auth
    description: Google OAuth (PKCE) sign-in, the guest demo login and sign-out (story NW-01).
  - name: User
    description: The signed-in user's profile and admin user management.
  - name: Market data
    description: Public, rate-limited instrument search, quotes, details and candles (story NW-03).
  - name: Simulated market (dev/test)
    description: Price pinning for the simulated market. Mounted only with MARKET_SIM_CONTROL_ENABLED=true; never in production.
  - name: Orders
    description: Market orders (NW-04), order history (NW-05), and good-till-cancelled limit and stop orders filled by a background matching engine (NW-08).
  - name: Watchlists
    description: Up to 10 named watchlists per user with live prices (story NW-06).
  - name: Portfolio
    description: Cash, positions at live prices, unrealized and realized P&L (story NW-05), equity history and risk analytics (story NW-10).
  - name: AI
    description: |
      AI features behind the LLM gateway (story NW-14): per-user daily token budget, a usage ledger and a
      deterministic fake provider (LLM_PROVIDER=fake). AI output is educational, never financial advice.
  - name: Learn
    description: Knowledge base articles and search over trading concepts (story NW-15).
  - name: Vault
    description: The Vault risk-free yield, opportunity cost, deposits and withdrawals (story NW-11).
  - name: Leaderboard
    description: Risk-adjusted and total return trader rankings (story NW-13).

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: HttpOnly session cookie set by the Google callback or POST /auth/guest.

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. Every `domain.Code*` constant in the backend is listed here and nothing
        else (enforced by `internal/handlers/openapi_parity_test.go`).
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - USER_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - INSTRUMENT_NOT_FOUND
        - MARKET_DATA_UNAVAILABLE
        - INSUFFICIENT_FUNDS
        - INSUFFICIENT_SHARES
        - CONFLICT
        - WATCHLIST_NOT_FOUND
        - WATCHLIST_ITEM_NOT_FOUND
        - WATCHLIST_LIMIT_REACHED
        - ARTICLE_NOT_FOUND
        - AI_BUDGET_EXCEEDED
        - AI_REFUSED
        - AI_UNAVAILABLE
        - ORDER_NOT_FOUND
        - ORDER_NOT_OPEN
        - INSUFFICIENT_VAULT_BALANCE

    Error:
      type: object
      description: The body of every error response.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message.
        code:
          $ref: "#/components/schemas/ErrorCode"

    Role:
      type: string
      enum: [member, admin, guest]

    Profile:
      type: object
      description: The signed-in user. Never exposes google_id.
      required: [id, name, email, role, balance, is_guest, leaderboard_opt_in]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          examples: [Guest trader]
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        balance:
          type: number
          description: Cash balance in SEK, 2 decimals.
          examples: [100000]
        is_guest:
          type: boolean
          description: True when role is guest.
        display_name:
          type: [string, "null"]
          description: Pseudonymous handle for the leaderboard.
          examples: [bull_42]
        leaderboard_opt_in:
          type: boolean
          description: True when opted in to the public leaderboard.

    Features:
      type: object
      description: Optional switches that are enabled on this deployment.
      required: [guest_auth, sim_control]
      properties:
        guest_auth:
          type: boolean
          description: True when AUTH_GUEST_ENABLED is on and POST /auth/guest is registered.
        sim_control:
          type: boolean
          description: |
            True when the dev/test price-pinning routes under /sim are mounted, i.e. MARKET_DATA_PROVIDER=simulated
            and MARKET_SIM_CONTROL_ENABLED=true. Must never be true in production.

    Health:
      type: object
      required: [status, version, features, market_data_provider, llm_provider]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        features:
          $ref: "#/components/schemas/Features"
        market_data_provider:
          type: string
          enum: [avanza, simulated]
          description: The active market data adapter (MARKET_DATA_PROVIDER, backend default avanza).
        llm_provider:
          type: string
          enum: [anthropic, fake]
          description: |
            The active LLM adapter behind the AI gateway (LLM_PROVIDER, backend default anthropic). `fake` answers
            deterministically and needs no API key; dev/test only.

    InstrumentSummary:
      type: object
      description: One instrument search hit. Prices are in `currency`, rounded half-up to 2 decimals.
      required: [orderbook_id, symbol, name, currency, market, last_price, change_percent]
      properties:
        orderbook_id:
          type: string
          description: Stable instrument id. Simulated instruments start with `SIM-`.
          examples: [SIM-FJRD, "5361"]
        symbol:
          type: string
          description: Ticker, e.g. FJRD. May be empty when the upstream has none.
        name:
          type: string
          examples: [Fjord Robotics]
        currency:
          type: string
          examples: [SEK]
        market:
          type: string
          description: Listing venue. `Simulated` for the simulated market.
          examples: [Simulated, Stockholmsbörsen]
        last_price:
          type: number
        change_percent:
          type: number
          description: Change against the price 24 hours earlier (simulated) or the previous close (Avanza), in percent, 2 decimals.

    InstrumentSearchResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Best match first, at most 20. Empty array when nothing matches.
          items: { $ref: "#/components/schemas/InstrumentSummary" }
        next_cursor:
          type: [string, "null"]
          description: Always null for now; search is not paginated.

    Quote:
      type: object
      description: |
        Latest price. On the simulated market `bid = last × 0.999` and `ask = last × 1.001` (20 bps spread),
        each rounded half-up to 2 decimals, so `0 < bid < last < ask`.
      required: [orderbook_id, symbol, last, bid, ask, change_percent, currency, updated_at]
      properties:
        orderbook_id: { type: string }
        symbol: { type: string }
        last: { type: number }
        bid: { type: number }
        ask: { type: number }
        change_percent: { type: number }
        currency: { type: string }
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.

    KeyIndicators:
      type: object
      description: null means the provider has no value (e.g. no P/E for a loss-making company).
      required: [pe_ratio, dividend_yield_pct, market_cap]
      properties:
        pe_ratio:
          type: [number, "null"]
          description: Price / earnings per share, 2 decimals.
        dividend_yield_pct:
          type: [number, "null"]
          description: Annual dividend / last price × 100, 2 decimals (e.g. 3.25 means 3.25 %).
        market_cap:
          type: [number, "null"]
          description: Market capitalisation in the instrument's currency.

    InstrumentDetails:
      type: object
      required: [orderbook_id, symbol, name, currency, market, sector, description, last_price, change_percent, key_indicators]
      properties:
        orderbook_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        currency: { type: string }
        market: { type: string }
        sector:
          type: string
          description: May be empty when the upstream has none.
        description:
          type: string
          description: Company description. Non-empty for every simulated instrument.
        last_price: { type: number }
        change_percent: { type: number }
        key_indicators: { $ref: "#/components/schemas/KeyIndicators" }

    CandlePeriod:
      type: string
      enum: ["1d", "1w", "1m", "3m", "1y"]
      description: |
        Chart window ending now, with its bar size:
        1d = 24 h of 15-minute bars, 1w = 7 days of 1-hour bars, 1m = 30 days of daily bars,
        3m = 90 days of daily bars, 1y = 365 days of weekly bars. The last bar may be partial.

    Candle:
      type: object
      description: One OHLCV bar. `l ≤ min(o, c)` and `h ≥ max(o, c)`.
      required: [t, o, h, l, c, v]
      properties:
        t:
          type: string
          format: date-time
          description: Bar start, RFC 3339 UTC.
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v:
          type: integer
          format: int64
          description: Volume in shares.

    CandlesResponse:
      type: object
      required: [orderbook_id, period, candles]
      properties:
        orderbook_id: { type: string }
        period: { $ref: "#/components/schemas/CandlePeriod" }
        candles:
          type: array
          description: Strictly ascending `t`.
          items: { $ref: "#/components/schemas/Candle" }

    SimPriceRequest:
      type: object
      required: [price]
      properties:
        price:
          type: number
          exclusiveMinimum: 0
          description: Pinned last price; stored rounded half-up to 2 decimals.

    OrderSide:
      type: string
      enum: [BUY, SELL]
      description: BUY fills at the ask, SELL fills at the bid.

    OrderType:
      type: string
      enum: [MARKET, LIMIT, STOP]
      description: |
        MARKET executes immediately. LIMIT and STOP are good-till-cancelled pending orders (story NW-08): they start
        OPEN and the matching engine fills them once the quote reaches their price (see OrderRequest).

    OrderStatus:
      type: string
      enum: [OPEN, FILLED, CANCELLED, REJECTED]
      description: |
        Market orders are always FILLED. A LIMIT or STOP order starts OPEN and moves exactly once, to FILLED (the
        matching engine), CANCELLED (DELETE /orders/{id}) or REJECTED (not enough buying power at fill time).

    OrderRequest:
      type: object
      required: [orderbook_id, side, quantity]
      properties:
        orderbook_id:
          type: string
          minLength: 1
          examples: [SIM-FJRD]
        side:
          $ref: "#/components/schemas/OrderSide"
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Shares, at most 4 decimals.
          examples: [10]
        type:
          $ref: "#/components/schemas/OrderType"
          description: Defaults to MARKET.
        limit_price:
          type: number
          exclusiveMinimum: 0
          description: Required for (and only allowed on) LIMIT orders. SEK, at most 2 decimals.
          examples: [95]
        stop_price:
          type: number
          exclusiveMinimum: 0
          description: Required for (and only allowed on) STOP orders. SEK, at most 2 decimals.
          examples: [90]
      description: |
        A market order executes at once. LIMIT and STOP orders are good-till-cancelled and start OPEN.

        Reservations at placement (money rounded half-up to 2 decimals; commission = max(1.00, 0.25% × gross)):
        - BUY LIMIT reserves quantity × limit_price + commission(quantity × limit_price);
        - BUY STOP reserves the same with round2(stop_price × 1.05) in place of limit_price;
        - SELL orders reserve the shares.
        buying_power = cash − reserved_cash and available shares = quantity − reserved_quantity; every order,
        market orders included, must fit them (422 INSUFFICIENT_FUNDS / INSUFFICIENT_SHARES otherwise).

        The matching engine checks open orders about once a second and fills them with the market pricing rules
        (see Order) when:
        - BUY LIMIT: ask ≤ limit_price (fills at the ask);
        - SELL LIMIT: bid ≥ limit_price (fills at the bid);
        - SELL STOP: bid ≤ stop_price (fills at the bid);
        - BUY STOP: ask ≥ stop_price (fills at the ask).
        When the cash outside other reservations no longer covers the total at fill time, the order is REJECTED
        with a reject_reason and its reservation is released.

    Order:
      type: object
      description: |
        An order and, once FILLED, its fill. Pricing (all money in SEK, rounded half-up to 2 decimals):
        - base price = ask for BUY, bid for SELL;
        - quantity > 100 applies 0.5% slippage against the trader (BUY × 1.005, SELL × 0.995);
        - fill_price = base price (after slippage) rounded to 2 decimals, before anything else;
        - gross = fill_price × quantity; commission = max(1.00, 0.25% × gross);
        - total = gross + commission (BUY, debited) or gross − commission (SELL, credited).
        A market order waits a simulated 50–500 ms before the price is read. fill_price, commission and total are
        null unless status is FILLED.
      required: [id, orderbook_id, symbol, name, side, type, status, quantity, limit_price, stop_price, fill_price, commission, total, reject_reason, created_at, filled_at]
      properties:
        id:
          type: integer
          format: int64
        orderbook_id:
          type: string
        symbol:
          type: string
        name:
          type: string
        side:
          $ref: "#/components/schemas/OrderSide"
        type:
          $ref: "#/components/schemas/OrderType"
        status:
          $ref: "#/components/schemas/OrderStatus"
        quantity:
          type: number
          description: Up to 4 decimals.
        limit_price:
          type: [number, "null"]
          description: The LIMIT order's price in SEK (2 decimals); null for other types.
        stop_price:
          type: [number, "null"]
          description: The STOP order's trigger price in SEK (2 decimals); null for other types.
        fill_price:
          type: [number, "null"]
          description: Price per share in SEK, 2 decimals. null unless FILLED.
        commission:
          type: [number, "null"]
          description: SEK, 2 decimals. null unless FILLED.
        total:
          type: [number, "null"]
          description: Cash debited (BUY) or credited (SELL) in SEK, 2 decimals. null unless FILLED.
        reject_reason:
          type: [string, "null"]
          description: Why the matching engine rejected the order; null unless REJECTED.
        created_at:
          type: string
          format: date-time
        filled_at:
          type: [string, "null"]
          format: date-time
          description: Set when status is FILLED.

    WatchlistNameRequest:
      type: object
      description: Body of POST /watchlists and PATCH /watchlists/{id}. The name is trimmed and must then be 1–50 characters.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          examples: [Energy]

    WatchlistItemRequest:
      type: object
      required: [orderbook_id]
      properties:
        orderbook_id:
          type: string
          minLength: 1
          description: Market data orderbook id; trimmed.
          examples: [SIM-NVE]

    WatchlistItem:
      type: object
      description: |
        One instrument on a list, with its current quote. `last_price` and `change_percent` come from the live quote
        (fetched concurrently for every item) and are null when the quote is unavailable.
      required: [orderbook_id, symbol, name, last_price, change_percent, added_at]
      properties:
        orderbook_id:
          type: string
          examples: [SIM-NVE]
        symbol:
          type: string
          examples: [NVE]
        name:
          type: string
          examples: [Nordvik Energy]
        last_price:
          type: [number, "null"]
          description: Last price in the instrument's currency, 2 decimals.
          examples: [100.00]
        change_percent:
          type: [number, "null"]
          description: Day change in percent, 2 decimals.
          examples: [-0.42]
        added_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.

    Watchlist:
      type: object
      description: A named list owned by the signed-in user. Items are in the order they were added (oldest first).
      required: [id, name, items, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          examples: [Energy]
        items:
          type: array
          items: { $ref: "#/components/schemas/WatchlistItem" }
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.

    WatchlistListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The user's lists, at most 10, oldest first. Empty array when there are none.
          items: { $ref: "#/components/schemas/Watchlist" }
        next_cursor:
          type: [string, "null"]
          description: Always null; a user has at most 10 lists, so the list is not paginated.

    OrderPage:
      type: object
      description: One page of the signed-in user's orders, newest first (created_at desc, then id desc).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
          description: Empty array (never null) when there are no orders.
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque cursor (URL-safe base64 of the last item's created_at and id). Pass it as `cursor` to get the
            next page. null when this is the last page.

    PortfolioPosition:
      type: object
      description: |
        One open position, valued at the live last price. Money in SEK, rounded half-up to 2 decimals at serialization;
        everything is computed in decimal first.
        - avg_cost = (sum of BUY totals for the open lot, commission included) / quantity; a SELL leaves it unchanged;
        - last_price = the quote's last price (2 decimals); when the quote fails, last_price = avg_cost and day_change_percent = 0;
        - market_value = last_price × quantity; unrealized_pnl = market_value − avg_cost × quantity;
        - unrealized_pnl_percent = unrealized_pnl / (avg_cost × quantity) × 100;
        - weight = market_value / holdings_value × 100 (0 when holdings_value is 0).
      required: [orderbook_id, symbol, name, quantity, avg_cost, last_price, market_value, unrealized_pnl, unrealized_pnl_percent, day_change_percent, weight, reserved_quantity]
      properties:
        orderbook_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        quantity:
          type: number
          description: Up to 4 decimals.
        avg_cost:
          type: number
          description: SEK per share incl. buy commission, 2 decimals.
        last_price:
          type: number
          description: SEK, 2 decimals.
        market_value:
          type: number
          description: SEK, 2 decimals.
        unrealized_pnl:
          type: number
          description: SEK, 2 decimals.
        unrealized_pnl_percent:
          type: number
          description: "Percent, 2 decimals (9.62 means +9.62%)."
        day_change_percent:
          type: number
          description: The quote's change today in percent, 2 decimals.
        weight:
          type: number
          description: Percent of holdings_value, 2 decimals.
        reserved_quantity:
          type: number
          description: Shares held back by OPEN SELL orders (up to 4 decimals); quantity − reserved_quantity can be sold.

    Portfolio:
      type: object
      description: |
        The signed-in user's portfolio. Money in SEK, 2 decimals.
        - holdings_value = Σ positions.market_value; total_equity = cash + holdings_value + vault_value;
        - unrealized_pnl = Σ positions.unrealized_pnl;
        - realized_pnl accumulates over every SELL: sell total (net proceeds) − avg_cost × quantity sold;
        - reserved_cash = Σ reservations of OPEN BUY orders (still part of cash); buying_power = cash − reserved_cash;
        - vault_value is the balance currently in The Vault (story NW-11).
        positions are sorted by market_value desc (largest holding first), then orderbook_id asc.
        top_movers is at most 5 positions sorted by day_change_percent desc, then orderbook_id asc.
        Both arrays are empty (never null) without positions.
      required: [cash, reserved_cash, buying_power, holdings_value, vault_value, total_equity, unrealized_pnl, realized_pnl, positions, top_movers]
      properties:
        cash: { type: number }
        reserved_cash: { type: number }
        buying_power: { type: number }
        holdings_value: { type: number }
        vault_value: { type: number, description: "Balance currently in the vault (story NW-11)." }
        total_equity: { type: number }
        unrealized_pnl: { type: number }
        realized_pnl: { type: number }
        positions:
          type: array
          items: { $ref: "#/components/schemas/PortfolioPosition" }
        top_movers:
          type: array
          items: { $ref: "#/components/schemas/PortfolioPosition" }

    AIFeature:
      type: string
      description: An AI feature that calls the LLM gateway. Each one has its own versioned prompt.
      enum: [instrument_brief, knowledge_ask]

    BriefMetric:
      type: object
      description: One number of the instrument, in plain language.
      required: [metric, value, explanation]
      properties:
        metric:
          type: string
          examples: [P/E ratio]
        value:
          type: string
          description: The value as shown to the user, already formatted.
          examples: ["14.25"]
        explanation:
          type: string

    Brief:
      type: object
      description: The model's structured answer (validated against this schema before it is stored).
      required: [summary, what_the_numbers_say, risks, beginner_takeaway]
      properties:
        summary:
          type: string
        what_the_numbers_say:
          type: array
          items: { $ref: "#/components/schemas/BriefMetric" }
        risks:
          type: array
          items: { type: string }
        beginner_takeaway:
          type: string

    InstrumentBrief:
      type: object
      description: |
        A plain-language AI brief of one instrument. Briefs are cached per instrument, UTC day and prompt version and
        shared by every user: the first request of the day generates it (`cached: false`), later ones reuse it.
      required: [orderbook_id, generated_at, model, prompt_version, cached, disclaimer, brief]
      properties:
        orderbook_id:
          type: string
          examples: [SIM-FJRD]
        generated_at:
          type: string
          format: date-time
          description: When the brief was generated (UTC).
        model:
          type: string
          description: The model that wrote the brief (`fake` with LLM_PROVIDER=fake).
          examples: [claude-opus-5-5]
        prompt_version:
          type: string
          description: The prompt template version, `<feature>.v<N>`.
          examples: [instrument_brief.v1]
        cached:
          type: boolean
          description: True when the brief came from today's cache instead of a new model call.
        disclaimer:
          type: string
          enum: ["AI-generated · educational, not financial advice"]
        brief:
          $ref: "#/components/schemas/Brief"

    AIFeatureUsage:
      type: object
      required: [feature, calls, input_tokens, output_tokens]
      properties:
        feature:
          $ref: "#/components/schemas/AIFeature"
        calls:
          type: integer
          format: int64
          description: Model calls today, failed and refused ones included. Cached answers are not calls.
        input_tokens:
          type: integer
          format: int64
          description: Uncached input tokens.
        output_tokens:
          type: integer
          format: int64

    AIUsage:
      type: object
      description: |
        The signed-in user's LLM usage for the current UTC day. `used_tokens` counts input, output, cache-read and
        cache-write tokens; the budget resets at 00:00 UTC. `by_feature` lists every feature, sorted by name.
      required: [date, budget_tokens, used_tokens, remaining_tokens, by_feature]
      properties:
        date:
          type: string
          format: date
          description: The UTC day, YYYY-MM-DD.
        budget_tokens:
          type: integer
          format: int64
          description: The daily per-user token budget (AI_DAILY_TOKEN_BUDGET, default 200000).
        used_tokens:
          type: integer
          format: int64
        remaining_tokens:
          type: integer
          format: int64
          description: max(0, budget_tokens - used_tokens).
        by_feature:
          type: array
          items: { $ref: "#/components/schemas/AIFeatureUsage" }

    HistoryRange:
      type: string
      enum: ["1d", "1w", "1m", all]
      description: |
        Window of GET /portfolio/history, ending now: 1d = the last 24 hours, raw snapshots; 1w = the last 7 days and
        1m = the last 30 days, bucketed hourly (the last snapshot of each UTC hour); all = every snapshot, bucketed
        daily (the last snapshot of each UTC day).

    EquityPoint:
      type: object
      description: One equity snapshot (cash + holdings at the last price + vault), SEK with 2 decimals.
      required: [t, equity]
      properties:
        t:
          type: string
          format: date-time
          description: When the snapshot was taken (RFC 3339, UTC).
        equity:
          type: number
          description: Total equity in SEK, 2 decimals.

    EquityHistory:
      type: object
      description: |
        The signed-in user's equity over the requested range, oldest first. Snapshots are taken after every fill and
        every SNAPSHOT_INTERVAL (default 1h) for users with at least one order, so a user without orders has no points.
      required: [range, points]
      properties:
        range: { $ref: "#/components/schemas/HistoryRange" }
        points:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
          description: Oldest first; empty (never null) when there are no snapshots in the range.

    AllocationSlice:
      type: object
      description: |
        One slice of the allocation: an open position (label = symbol) or the cash (label "Cash", orderbook_id null).
        weight = value / total_equity × 100.
      required: [label, orderbook_id, value, weight]
      properties:
        label:
          type: string
          description: The instrument's symbol, or "Cash".
        orderbook_id:
          type: [string, "null"]
          description: The position's orderbook id; null for the cash slice.
        value:
          type: number
          description: Market value at the last price (cash itself for the cash slice), SEK with 2 decimals.
        weight:
          type: number
          description: Percent of total equity, 2 decimals. The weights of all slices sum to exactly 100 (the rounding remainder goes to the largest slice); all 0 when total equity is 0.

    PortfolioAnalytics:
      type: object
      description: |
        Risk-adjusted performance of the signed-in user. Computed from the daily series (the last equity snapshot of
        each UTC day, oldest first) with daily returns r_d = equity_d / equity_(d-1) − 1:
        - total_return_pct = (total_equity / 100000 − 1) × 100, from the live portfolio and the 100,000 SEK start;
        - volatility_annualized_pct = stdev(r_d) × √252 × 100 (sample standard deviation, n − 1);
        - sharpe_ratio = (mean(r_d) − rf / 252) / stdev(r_d) × √252 with rf = RISK_FREE_RATE (default 0.02);
          null also when stdev(r_d) is 0;
        - max_drawdown_pct = the largest peak-to-trough decline of the daily equity, as a negative percentage
          (0 when equity never fell).
        Volatility, Sharpe and drawdown need at least 5 daily returns (data_points ≥ 5); below that they are null and
        sufficient_data is false. Percentages and the ratio are rounded half-up to 2 decimals.
      required: [total_return_pct, volatility_annualized_pct, sharpe_ratio, max_drawdown_pct, sufficient_data, data_points, allocation]
      properties:
        total_return_pct:
          type: number
          description: "Percent, 2 decimals (1.25 means +1.25%)."
        volatility_annualized_pct:
          type: [number, "null"]
          description: Annualized volatility in percent, 2 decimals; null without sufficient data.
        sharpe_ratio:
          type: [number, "null"]
          description: Annualized Sharpe ratio, 2 decimals; null without sufficient data or when volatility is 0.
        max_drawdown_pct:
          type: [number, "null"]
          description: Largest peak-to-trough decline in percent (≤ 0), 2 decimals; null without sufficient data.
        sufficient_data:
          type: boolean
          description: True when data_points ≥ 5.
        data_points:
          type: integer
          minimum: 0
          description: Number of daily returns in the daily series (days with a snapshot − 1, never below 0).
        allocation:
          type: array
          items: { $ref: "#/components/schemas/AllocationSlice" }
          description: Positions by value desc (then orderbook id asc), then the cash slice, which is always present.

    Vault:
      type: object
      description: The signed-in user's vault status and risk-free yield.
      required: [balance, apy, interest_earned_total, projected_monthly_interest_on_idle_cash]
      properties:
        balance:
          type: number
          description: Current balance in the vault in SEK, 2 decimals.
        apy:
          type: number
          description: Annual percentage yield as a fraction (e.g. 0.051).
        interest_earned_total:
          type: number
          description: Total accrued interest earned in SEK, 2 decimals.
        projected_monthly_interest_on_idle_cash:
          type: number
          description: Projected 30-day interest on uninvested cash (idle cash × APY × 30 / 365) in SEK, 2 decimals.

    VaultTransferRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          description: Amount in SEK, positive, at most 2 decimal places.

    VaultTransaction:
      type: object
      required: [id, type, amount, created_at]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          type: number
          description: Amount in SEK, 2 decimals.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.

    VaultTransactionListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VaultTransaction" }
          description: Vault transactions, newest first.
        next_cursor:
          type: [string, "null"]
          description: Kept for list pagination convention; always null for now.

    UpdateProfileRequest:
      type: object
      description: Fields to update on the user profile (story NW-13).
      properties:
        display_name:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]{3,20}$'
          description: Unique pseudonymous handle, 3–20 characters [A-Za-z0-9_-].
          example: bull_42
        leaderboard_opt_in:
          type: boolean
          description: Whether to appear on public leaderboards.

    LeaderboardMetric:
      type: string
      enum: [return, sharpe]
      description: Ranking metric for the leaderboard.

    LeaderboardEntry:
      type: object
      description: One ranked leaderboard entry (story NW-13). Exposes no internal ID, email or balance.
      required: [rank, display_name, total_return_pct, sharpe_ratio, max_drawdown_pct, is_me]
      properties:
        rank:
          type: integer
          minimum: 1
          description: Rank (1-based). Ties broken by earlier opted_in_at.
        display_name:
          type: string
          description: Unique pseudonymous handle.
        total_return_pct:
          type: number
          description: Total return in percent, 2 decimals.
        sharpe_ratio:
          type: [number, "null"]
          description: Annualized Sharpe ratio, 2 decimals (null if insufficient data).
        max_drawdown_pct:
          type: [number, "null"]
          description: Maximum drawdown in percent, 2 decimals (null if insufficient data).
        is_me:
          type: boolean
          description: True when this entry belongs to the caller.

    LeaderboardPage:
      type: object
      description: A page of ranked leaderboard entries.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
          description: Leaderboard entries ordered by rank. The caller's own entry is appended if outside the page.

    ArticleSummary:
      type: object
      description: Summary of a knowledge base article (story NW-15).
      required: [slug, title, summary, tags]
      properties:
        slug:
          type: string
          examples: [slippage]
        title:
          type: string
          examples: ["Slippage: Why Orders Fill Off-Price"]
        summary:
          type: string
          examples: ["How execution latency and volume affect order fill prices."]
        tags:
          type: array
          items: { type: string }
          examples: [[execution, risk]]

    ArticleListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ArticleSummary" }

    Article:
      type: object
      description: Full knowledge base article with markdown content (story NW-15).
      required: [slug, title, summary, tags, body_markdown, updated_at]
      properties:
        slug:
          type: string
          examples: [slippage]
        title:
          type: string
          examples: ["Slippage: Why Orders Fill Off-Price"]
        summary:
          type: string
          examples: ["How execution latency and volume affect order fill prices."]
        tags:
          type: array
          items: { type: string }
        body_markdown:
          type: string
        updated_at:
          type: string
          format: date-time

    ArticleSearchResult:
      type: object
      description: One search result chunk from the knowledge base (story NW-15).
      required: [slug, title, chunk_id, snippet]
      properties:
        slug:
          type: string
          examples: [slippage]
        title:
          type: string
          examples: ["Slippage: Why Orders Fill Off-Price"]
        chunk_id:
          type: string
          examples: [slippage-what-is-slippage]
        snippet:
          type: string
          examples: ["<b>Slippage</b> is the difference between expected and executed price..."]

    ArticleSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ArticleSearchResult" }

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          examples: ["What is slippage?"]

    Citation:
      type: object
      required: [article_slug, article_title, chunk_id, quoted_text]
      properties:
        article_slug:
          type: string
          examples: [slippage]
        article_title:
          type: string
          examples: ["Slippage: Why Orders Fill Off-Price"]
        chunk_id:
          type: string
          examples: [slippage-what-is-slippage]
        quoted_text:
          type: string
          examples: ["Slippage is the difference between the expected price and executed price."]

    AskResponse:
      type: object
      required: [answer, citations, model, disclaimer]
      properties:
        answer:
          type: string
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        model:
          type: string
          examples: [fake]
        disclaimer:
          type: string
          enum: ["AI-generated · educational, not financial advice"]

  responses:
    Unauthenticated:
      description: Missing, unknown or expired session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "authentication required", code: UNAUTHENTICATED }
    Forbidden:
      description: Signed in, but the role is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "forbidden", code: FORBIDDEN }
    ValidationError:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "period must be one of 1d, 1w, 1m, 3m, 1y", code: VALIDATION_ERROR }
    InstrumentNotFound:
      description: Unknown orderbook id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "instrument not found", code: INSTRUMENT_NOT_FOUND }
    MarketDataUnavailable:
      description: The market data upstream failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "market data unavailable", code: MARKET_DATA_UNAVAILABLE }
    RateLimited:
      description: Too many requests from this IP (5 per second, burst 10, shared by every /market route).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "too many requests, please try again later", code: RATE_LIMITED }

    WatchlistNotFound:
      description: No list with this id belongs to the signed-in user (another user's list is reported the same way).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "watchlist not found", code: WATCHLIST_NOT_FOUND }
    WatchlistValidationError:
      description: Malformed JSON, a non-numeric list id, or a name that is blank or longer than 50 characters after trimming.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "name must be at most 50 characters", code: VALIDATION_ERROR }

    AIBudgetExceeded:
      description: The user's daily token budget is used up; it resets at 00:00 UTC.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "daily AI token budget exceeded, try again tomorrow", code: AI_BUDGET_EXCEEDED }
    AIRefused:
      description: The model declined to answer (also after the server-side fallback).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "the AI declined to answer this request", code: AI_REFUSED }
    AIUnavailable:
      description: The LLM provider failed, timed out, was cut off at max_tokens or returned an invalid answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "the AI service is unavailable, please try again later", code: AI_UNAVAILABLE }
    OrderNotFound:
      description: No order with this id belongs to the signed-in user (another user's order is reported the same way).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "order not found", code: ORDER_NOT_FOUND }
    OrderIDValidationError:
      description: The order id is not a positive integer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "order id must be a positive integer", code: VALIDATION_ERROR }
    ArticleNotFound:
      description: No article exists for the requested slug (story NW-15).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "article not found", code: ARTICLE_NOT_FOUND }

  parameters:
    ArticleSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      examples:
        slippage: { value: slippage }
    OrderID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    OrderbookID:
      name: orderbook_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      examples:
        simulated: { value: SIM-FJRD }
    WatchlistID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

paths:
  /health:
    get:
      summary: Liveness, build version and enabled features
      operationId: getHealth
      tags: [Meta]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, version: 0.0.0, market_data_provider: simulated, llm_provider: fake, features: { guest_auth: true, sim_control: true } }

  /openapi.yaml:
    get:
      summary: This OpenAPI document
      description: |
        The contract the running build was compiled with (embedded with `go:embed`). Public, no session needed.
        The interactive reference at `GET /api/docs` (outside `/api/v1`, so not listed here) renders it.
      operationId: getOpenAPISpec
      tags: [Meta]
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }

  /auth/login:
    get:
      summary: Start Google OAuth (PKCE); redirects to Google
      operationId: login
      tags: [Auth]
      security: []
      responses:
        "302":
          description: Redirect to Google. Sets the HttpOnly oauth_state cookie.
        "500":
          description: The OAuth state could not be created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "failed to start login", code: INTERNAL_ERROR }

  /auth/callback:
    get:
      summary: Google OAuth callback; sets session_id and redirects to the frontend
      operationId: callback
      tags: [Auth]
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: Redirect to FRONTEND_URL/dashboard. Sets the HttpOnly session_id cookie.
        "400":
          description: The state does not match the oauth_state cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "invalid OAuth state", code: VALIDATION_ERROR }
        "401":
          description: Google rejected the code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Google authentication failed", code: UNAUTHENTICATED }

  /auth/guest:
    post:
      summary: Sign in as a fresh guest (demo and E2E login)
      description: |
        Only registered when AUTH_GUEST_ENABLED=true; otherwise the route does not exist and returns 404.
        Takes no body. Each call creates a new guest user (role guest, name "Guest trader", balance 100000)
        and a session lasting AUTH_GUEST_SESSION_TTL (default 24h). Rate-limited per client IP
        (AUTH_GUEST_RATE_LIMIT_PER_MINUTE, default 10 per minute). Guests are hard-deleted 24h after
        their newest session expired.
      operationId: loginAsGuest
      tags: [Auth]
      security: []
      responses:
        "201":
          description: Guest created and signed in.
          headers:
            Set-Cookie:
              description: "session_id=<opaque>; Path=/; Max-Age=<ttl seconds>; HttpOnly"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
              example: { id: 17, name: Guest trader, email: guest-3f2a…@guest.tradeedu.invalid, role: guest, balance: 100000, is_guest: true }
        "404":
          description: Guest login is disabled on this deployment.
        "429":
          description: Too many guest logins from this IP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "too many guest logins, please try again later", code: RATE_LIMITED }
        "500":
          description: Could not create the guest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "failed to create guest", code: INTERNAL_ERROR }

  /auth/logout:
    post:
      summary: End the current session
      description: Deletes the session (if any) and clears the session_id cookie. Always 204.
      operationId: logout
      tags: [Auth]
      security: []
      responses:
        "204":
          description: Signed out.

  /user/profile:
    get:
      summary: The signed-in user's profile
      operationId: getProfile
      tags: [User]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me:
    patch:
      summary: Update the signed-in user's profile
      description: |
        Updates the user's pseudonymous display name and/or leaderboard opt-in status (story NW-13).
        Display name must be 3–20 characters [A-Za-z0-9_-] and unique (case-insensitive).
      operationId: updateProfile
      tags: [User]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: Display name already taken (case-insensitive).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "display name already taken", code: CONFLICT }

  /admin/users/{id}:
    delete:
      summary: Delete a user (admin only)
      operationId: deleteUser
      tags: [User]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204":
          description: Deleted.
        "400":
          description: Invalid id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "invalid user ID", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "user not found", code: USER_NOT_FOUND }

  # Market data (story NW-03). Public (no session needed) and rate-limited per client IP.
  # Served by the provider chosen with MARKET_DATA_PROVIDER (avanza | simulated).
  /market/instruments:
    get:
      summary: Search instruments
      operationId: searchInstruments
      tags: ["Market data"]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Matched case-insensitively against symbol, name and orderbook id. Trimmed; blank is rejected.
          schema: { type: string, minLength: 1 }
          example: fjord
      responses:
        "200":
          description: Matches, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentSearchResponse" }
              example:
                items:
                  - { orderbook_id: SIM-FJRD, symbol: FJRD, name: Fjord Robotics, currency: SEK, market: Simulated, last_price: 142.37, change_percent: 1.25 }
                next_cursor: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  /market/instruments/{orderbook_id}:
    get:
      summary: Instrument details and key indicators
      operationId: getInstrumentDetails
      tags: ["Market data"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentDetails" }
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  /market/instruments/{orderbook_id}/quote:
    get:
      summary: Latest quote with bid and ask
      operationId: getQuote
      tags: ["Market data"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
              example: { orderbook_id: SIM-FJRD, symbol: FJRD, last: 100.00, bid: 99.90, ask: 100.10, change_percent: -0.42, currency: SEK, updated_at: "2026-10-25T09:41:00Z" }
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  /market/instruments/{orderbook_id}/candles:
    get:
      summary: OHLCV candles for a chart period
      operationId: getCandles
      tags: ["Market data"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
        - name: period
          in: query
          required: true
          schema: { $ref: "#/components/schemas/CandlePeriod" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandlesResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  # Live quotes (story NW-09). Public, Server-Sent Events. One upstream poll per instrument is shared by every stream.
  /market/stream:
    get:
      summary: Live quotes over Server-Sent Events
      description: |
        Streams live quotes for up to 50 instruments as `text/event-stream`. Every request parameter is validated and
        every id is resolved **before** the stream starts, so a bad request gets a normal JSON error instead.

        Events (each `data` line is one JSON document):

        - `event: quote`: `data` is a `Quote` (same schema as `GET /market/instruments/{orderbook_id}/quote`). On
          connect the stream sends the current quote of every requested id at once; afterwards it sends a quote only
          when it changed (last, bid, ask or change_percent). The server polls the provider once per instrument every
          `MARKET_STREAM_INTERVAL` (backend default 2s, compose 1s), shared by all streams watching it.
        - `event: error`: `data` is an `Error`. Sent just before the server ends the stream (e.g. on shutdown); the
          client should reconnect.
        - `: ping` comment lines every `MARKET_STREAM_HEARTBEAT` (default 10s) keep idle connections open.

        The first message is `retry: 3000` (EventSource reconnect delay in ms). Responses carry
        `Cache-Control: no-cache, no-transform` and `X-Accel-Buffering: no` so proxies don't buffer them.
        Connecting counts as one request against the shared per-IP `/market` rate limit, and an IP can hold at most
        `MARKET_STREAM_MAX_PER_IP` (default 5) streams at the same time. A slow client never blocks others: per
        instrument it only keeps the latest undelivered quote.
      operationId: streamQuotes
      tags: ["Market data"]
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          description: |
            Comma-separated orderbook ids, 1 to 50 entries. Entries are trimmed, blank entries are ignored and
            duplicates are streamed once.
          schema: { type: string, minLength: 1 }
          example: SIM-FJRD,SIM-NVE
      responses:
        "200":
          description: The event stream. It stays open until the client disconnects or the server shuts down.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Server-Sent Events: `quote` (data: Quote), `error` (data: Error) and `: ping` comments."
              example: |
                retry: 3000

                event: quote
                data: {"orderbook_id":"SIM-FJRD","symbol":"FJRD","last":123.45,"bid":123.33,"ask":123.57,"change_percent":1.25,"currency":"SEK","updated_at":"2026-11-08T09:41:00Z"}

                : ping

        "400":
          description: "`ids` is missing, has no non-blank entry, or has more than 50 entries."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "ids must list at most 50 orderbook ids", code: VALIDATION_ERROR }
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
        "429":
          description: Over the per-IP `/market` rate limit, or this IP already holds `MARKET_STREAM_MAX_PER_IP` open streams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "too many open streams from this address", code: RATE_LIMITED }
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  # Simulated market control (story NW-03). DEV/TEST ONLY: the routes exist only when MARKET_DATA_PROVIDER=simulated
  # and MARKET_SIM_CONTROL_ENABLED=true (otherwise 404); no session needed, no rate limit. Pins are global and in memory.
  /sim/instruments/{orderbook_id}/price:
    put:
      summary: Pin the last price of a simulated instrument
      description: Until the pin is cleared, quote/search/details report exactly this last price (bid/ask follow the 20 bps spread). Candles ignore pins.
      operationId: pinSimPrice
      tags: ["Simulated market (dev/test)"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimPriceRequest" }
            example: { price: 100 }
      responses:
        "204":
          description: Pinned.
        "400":
          description: Missing, malformed or non-positive price.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "price must be greater than 0", code: VALIDATION_ERROR }
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
    delete:
      summary: Clear the pinned price
      description: Idempotent. The price follows the simulated path again.
      operationId: clearSimPrice
      tags: ["Simulated market (dev/test)"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
      responses:
        "204":
          description: Cleared (or there was no pin).
        "404":
          $ref: "#/components/responses/InstrumentNotFound"

  /orders:
    get:
      summary: List the signed-in user's orders
      description: Newest first (created_at desc, then id desc), keyset-paginated with an opaque cursor. Other users' orders are never returned.
      operationId: listOrders
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: next_cursor of the previous page. Send the same status filter on every page.
        - name: status
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { $ref: "#/components/schemas/OrderStatus" }
          description: Only orders in one of these statuses, comma-separated (e.g. `OPEN`, or `FILLED,CANCELLED,REJECTED`).
      responses:
        "200":
          description: One page of orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
              example:
                items:
                  - id: 43
                    orderbook_id: SIM-NVE
                    symbol: NVE
                    name: Nordvik Energy
                    side: SELL
                    type: MARKET
                    status: FILLED
                    quantity: 5
                    limit_price: null
                    stop_price: null
                    fill_price: 109.89
                    commission: 1.37
                    total: 548.08
                    reject_reason: null
                    created_at: "2026-10-26T09:42:00Z"
                    filled_at: "2026-10-26T09:42:00Z"
                next_cursor: eyJjIjoiMjAyNi0xMC0yNlQwOTo0MjowMFoiLCJpIjo0M30
        "400":
          description: limit is not an integer from 1 to 100, cursor is malformed, or status is not a list of OrderStatus values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "limit must be an integer from 1 to 100", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Place an order
      description: |
        A MARKET order is priced from the live quote (see the Order schema) and, in one DB transaction, the user row
        is locked, buying power or available shares are checked, the cash moves, the position is updated and the
        order is stored FILLED (201). Concurrent orders by the same user are serialized, so cash never goes negative.

        A LIMIT or STOP order is stored OPEN (201) after its reservation (see OrderRequest) is checked against buying
        power or available shares and booked in the same kind of transaction; the matching engine fills it later.

        With an `Idempotency-Key` header, a retry with the same key and the same body returns the original order
        (200, identical body) and executes nothing; the same key with a different body is 409 CONFLICT.
        Keys are unique per user, also under concurrent retries.
      operationId: placeOrder
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]+$" }
          description: Client-chosen key (printable ASCII, no spaces), e.g. a UUID per user action.
          examples:
            retry: { value: k-123 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
            examples:
              market: { value: { orderbook_id: SIM-FJRD, side: BUY, quantity: 10 } }
              limit: { value: { orderbook_id: SIM-KALL, side: BUY, type: LIMIT, quantity: 10, limit_price: 95 } }
              stop: { value: { orderbook_id: SIM-KALL, side: SELL, type: STOP, quantity: 10, stop_price: 90 } }
      responses:
        "201":
          description: Executed (MARKET, status FILLED) or accepted (LIMIT/STOP, status OPEN).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 42
                orderbook_id: SIM-FJRD
                symbol: FJRD
                name: Fjord Robotics
                side: BUY
                type: MARKET
                status: FILLED
                quantity: 10
                limit_price: null
                stop_price: null
                fill_price: 100.10
                commission: 2.50
                total: 1003.50
                reject_reason: null
                created_at: "2026-10-25T09:41:00Z"
                filled_at: "2026-10-25T09:41:00Z"
        "200":
          description: Replay of an earlier request with the same Idempotency-Key; the body equals the original 201 body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: |
            Malformed JSON, blank orderbook_id, side not BUY/SELL, quantity <= 0 or with more than 4 decimals, an
            unknown type, a missing, non-positive or over-precise (more than 2 decimals) limit_price on LIMIT or
            stop_price on STOP, a price on a type that takes none, or an invalid Idempotency-Key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "quantity must be greater than 0", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
        "409":
          description: The Idempotency-Key was already used for a different order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "idempotency key already used for a different order", code: CONFLICT }
        "422":
          description: Business rule (buying power or available shares); nothing was executed or reserved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                funds: { value: { error: "not enough cash for this order", code: INSUFFICIENT_FUNDS } }
                shares: { value: { error: "not enough shares to sell", code: INSUFFICIENT_SHARES } }
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    get:
      summary: One of the signed-in user's orders
      description: Use it to poll an OPEN order until the matching engine fills or rejects it.
      operationId: getOrder
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 51
                orderbook_id: SIM-KALL
                symbol: KALL
                name: Kallsten Bank
                side: BUY
                type: LIMIT
                status: FILLED
                quantity: 10
                limit_price: 95.00
                stop_price: null
                fill_price: 94.89
                commission: 2.37
                total: 951.27
                reject_reason: null
                created_at: "2026-11-08T09:41:00Z"
                filled_at: "2026-11-08T09:41:03Z"
        "400":
          $ref: "#/components/responses/OrderIDValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
    delete:
      summary: Cancel an OPEN order
      description: |
        In one transaction (user, position and order rows locked, in that order) the order moves from OPEN to
        CANCELLED and its reservation is released. A fill and a cancel racing for the same order serialize on these
        locks: whichever commits first wins, and the other sees the order is no longer OPEN.
      operationId: cancelOrder
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Cancelled; the order with status CANCELLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/OrderIDValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: The order is not OPEN any more (already filled, cancelled or rejected).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "order is not open", code: ORDER_NOT_OPEN }

  # Watchlists (story NW-06). Every route needs a session and only sees the caller's own lists:
  # another user's list id is 404 WATCHLIST_NOT_FOUND, never 403. Items are keyed by orderbook_id.
  /watchlists:
    get:
      summary: The signed-in user's watchlists with live prices
      operationId: listWatchlists
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistListResponse" }
              example:
                items:
                  - id: 7
                    name: Energy
                    created_at: "2026-11-08T09:41:00Z"
                    items:
                      - { orderbook_id: SIM-NVE, symbol: NVE, name: Nordvik Energy, last_price: 100.00, change_percent: -0.42, added_at: "2026-11-08T09:41:05Z" }
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Create a watchlist
      description: A user has at most 10 lists; the 11th is 422 WATCHLIST_LIMIT_REACHED. Names need not be unique.
      operationId: createWatchlist
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistNameRequest" }
