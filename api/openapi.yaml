  # Simulated market control (story NW-03). DEV/TEST ONLY: the routes exist only when MARKET_DATA_PROVIDER=simulated
  # and MARKET_SIM_CONTROL_ENABLED=true (otherwise 404); no session needed, no rate limit. Pins are global and in memory.
  /sim/instruments/{orderbook_id}/price:
    put:
      summary: Pin the last price of a simulated instrument
      description: Until the pin is cleared, quote/search/details report exactly this last price (bid/ask follow the 20 bps spread). Candles ignore pins.
      operationId: pinSimPrice
      tags: ["Simulated market (dev/test)"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimPriceRequest" }
            example: { price: 100 }
      responses:
        "204":
          description: Pinned.
        "400":
          description: Missing, malformed or non-positive price.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "price must be greater than 0", code: VALIDATION_ERROR }
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
    delete:
      summary: Clear the pinned price
      description: Idempotent. The price follows the simulated path again.
      operationId: clearSimPrice
      tags: ["Simulated market (dev/test)"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderbookID"
      responses:
        "204":
          description: Cleared (or there was no pin).
        "404":
          $ref: "#/components/responses/InstrumentNotFound"

  /orders:
    get:
      summary: List the signed-in user's orders
      description: Newest first (created_at desc, then id desc), keyset-paginated with an opaque cursor. Other users' orders are never returned.
      operationId: listOrders
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: next_cursor of the previous page. Send the same status filter on every page.
        - name: status
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { $ref: "#/components/schemas/OrderStatus" }
          description: Only orders in one of these statuses, comma-separated (e.g. `OPEN`, or `FILLED,CANCELLED,REJECTED`).
      responses:
        "200":
          description: One page of orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
              example:
                items:
                  - id: 43
                    orderbook_id: SIM-NVE
                    symbol: NVE
                    name: Nordvik Energy
                    side: SELL
                    type: MARKET
                    status: FILLED
                    quantity: 5
                    limit_price: null
                    stop_price: null
                    fill_price: 109.89
                    commission: 1.37
                    total: 548.08
                    reject_reason: null
                    created_at: "2026-10-26T09:42:00Z"
                    filled_at: "2026-10-26T09:42:00Z"
                next_cursor: eyJjIjoiMjAyNi0xMC0yNlQwOTo0MjowMFoiLCJpIjo0M30
        "400":
          description: limit is not an integer from 1 to 100, cursor is malformed, or status is not a list of OrderStatus values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "limit must be an integer from 1 to 100", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Place an order
      description: |
        A MARKET order is priced from the live quote (see the Order schema) and, in one DB transaction, the user row
        is locked, buying power or available shares are checked, the cash moves, the position is updated and the
        order is stored FILLED (201). Concurrent orders by the same user are serialized, so cash never goes negative.

        A LIMIT or STOP order is stored OPEN (201) after its reservation (see OrderRequest) is checked against buying
        power or available shares and booked in the same kind of transaction; the matching engine fills it later.

        With an `Idempotency-Key` header, a retry with the same key and the same body returns the original order
        (200, identical body) and executes nothing; the same key with a different body is 409 CONFLICT.
        Keys are unique per user, also under concurrent retries.
      operationId: placeOrder
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]+$" }
          description: Client-chosen key (printable ASCII, no spaces), e.g. a UUID per user action.
          examples:
            retry: { value: k-123 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
            examples:
              market: { value: { orderbook_id: SIM-FJRD, side: BUY, quantity: 10 } }
              limit: { value: { orderbook_id: SIM-KALL, side: BUY, type: LIMIT, quantity: 10, limit_price: 95 } }
              stop: { value: { orderbook_id: SIM-KALL, side: SELL, type: STOP, quantity: 10, stop_price: 90 } }
      responses:
        "201":
          description: Executed (MARKET, status FILLED) or accepted (LIMIT/STOP, status OPEN).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 42
                orderbook_id: SIM-FJRD
                symbol: FJRD
                name: Fjord Robotics
                side: BUY
                type: MARKET
                status: FILLED
                quantity: 10
                limit_price: null
                stop_price: null
                fill_price: 100.10
                commission: 2.50
                total: 1003.50
                reject_reason: null
                created_at: "2026-10-25T09:41:00Z"
                filled_at: "2026-10-25T09:41:00Z"
        "200":
          description: Replay of an earlier request with the same Idempotency-Key; the body equals the original 201 body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: |
            Malformed JSON, blank orderbook_id, side not BUY/SELL, quantity <= 0 or with more than 4 decimals, an
            unknown type, a missing, non-positive or over-precise (more than 2 decimals) limit_price on LIMIT or
            stop_price on STOP, a price on a type that takes none, or an invalid Idempotency-Key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "quantity must be greater than 0", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/InstrumentNotFound"
        "409":
          description: The Idempotency-Key was already used for a different order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "idempotency key already used for a different order", code: CONFLICT }
        "422":
          description: Business rule (buying power or available shares); nothing was executed or reserved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                funds: { value: { error: "not enough cash for this order", code: INSUFFICIENT_FUNDS } }
                shares: { value: { error: "not enough shares to sell", code: INSUFFICIENT_SHARES } }
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    get:
      summary: One of the signed-in user's orders
      description: Use it to poll an OPEN order until the matching engine fills or rejects it.
      operationId: getOrder
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 51
                orderbook_id: SIM-KALL
                symbol: KALL
                name: Kallsten Bank
                side: BUY
                type: LIMIT
                status: FILLED
                quantity: 10
                limit_price: 95.00
                stop_price: null
                fill_price: 94.89
                commission: 2.37
                total: 951.27
                reject_reason: null
                created_at: "2026-11-08T09:41:00Z"
                filled_at: "2026-11-08T09:41:03Z"
        "400":
          $ref: "#/components/responses/OrderIDValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
    delete:
      summary: Cancel an OPEN order
      description: |
        In one transaction (user, position and order rows locked, in that order) the order moves from OPEN to
        CANCELLED and its reservation is released. A fill and a cancel racing for the same order serialize on these
        locks: whichever commits first wins, and the other sees the order is no longer OPEN.
      operationId: cancelOrder
      tags: [Orders]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Cancelled; the order with status CANCELLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/OrderIDValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: The order is not OPEN any more (already filled, cancelled or rejected).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "order is not open", code: ORDER_NOT_OPEN }

  # Watchlists (story NW-06). Every route needs a session and only sees the caller's own lists:
  # another user's list id is 404 WATCHLIST_NOT_FOUND, never 403. Items are keyed by orderbook_id.
  /watchlists:
    get:
      summary: The signed-in user's watchlists with live prices
      operationId: listWatchlists
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistListResponse" }
              example:
                items:
                  - id: 7
                    name: Energy
                    created_at: "2026-11-08T09:41:00Z"
                    items:
                      - { orderbook_id: SIM-NVE, symbol: NVE, name: Nordvik Energy, last_price: 100.00, change_percent: -0.42, added_at: "2026-11-08T09:41:05Z" }
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Create a watchlist
      description: A user has at most 10 lists; the 11th is 422 WATCHLIST_LIMIT_REACHED. Names need not be unique.
      operationId: createWatchlist
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistNameRequest" }
            example: { name: Energy }
      responses:
        "201":
          description: Created, with no items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
              example: { id: 7, name: Energy, items: [], created_at: "2026-11-08T09:41:00Z" }
        "400":
          $ref: "#/components/responses/WatchlistValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: The user already has 10 lists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "you can have at most 10 watchlists", code: WATCHLIST_LIMIT_REACHED }

  /watchlists/{id}:
    parameters:
      - $ref: "#/components/parameters/WatchlistID"
    get:
      summary: One watchlist with live prices
      operationId: getWatchlist
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "400":
          $ref: "#/components/responses/WatchlistValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/WatchlistNotFound"
    patch:
      summary: Rename a watchlist
      operationId: renameWatchlist
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistNameRequest" }
            example: { name: Renewables }
      responses:
        "200":
          description: Renamed; the full list with live prices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "400":
          $ref: "#/components/responses/WatchlistValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/WatchlistNotFound"
    delete:
      summary: Delete a watchlist and its items
      operationId: deleteWatchlist
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/WatchlistValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/WatchlistNotFound"

  /watchlists/{id}/items:
    parameters:
      - $ref: "#/components/parameters/WatchlistID"
    post:
      summary: Add an instrument to a watchlist
      description: |
        The list's ownership is checked first (404 WATCHLIST_NOT_FOUND), then the instrument (404 INSTRUMENT_NOT_FOUND),
        then uniqueness: an instrument is on a list at most once (409 CONFLICT).
      operationId: addWatchlistItem
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistItemRequest" }
            example: { orderbook_id: SIM-NVE }
      responses:
        "201":
          description: Added; the new item with its current price.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistItem" }
              example: { orderbook_id: SIM-NVE, symbol: NVE, name: Nordvik Energy, last_price: 100.00, change_percent: -0.42, added_at: "2026-11-08T09:41:05Z" }
        "400":
          description: Malformed JSON, a non-numeric list id or a blank orderbook_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "orderbook_id is required", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The list is not the user's (WATCHLIST_NOT_FOUND) or the instrument is unknown (INSTRUMENT_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                watchlist: { value: { error: "watchlist not found", code: WATCHLIST_NOT_FOUND } }
                instrument: { value: { error: "instrument not found", code: INSTRUMENT_NOT_FOUND } }
        "409":
          description: The instrument is already on this list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "instrument is already on this watchlist", code: CONFLICT }
        "502":
          $ref: "#/components/responses/MarketDataUnavailable"

  /watchlists/{id}/items/{orderbook_id}:
    parameters:
      - $ref: "#/components/parameters/WatchlistID"
      - $ref: "#/components/parameters/OrderbookID"
    delete:
      summary: Remove an instrument from a watchlist
      operationId: removeWatchlistItem
      tags: [Watchlists]
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/WatchlistValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The list is not the user's (WATCHLIST_NOT_FOUND) or the instrument is not on it (WATCHLIST_ITEM_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                watchlist: { value: { error: "watchlist not found", code: WATCHLIST_NOT_FOUND } }
                item: { value: { error: "instrument is not on this watchlist", code: WATCHLIST_ITEM_NOT_FOUND } }

