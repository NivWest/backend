    get:
      summary: The signed-in user's vault balance, APY, interest earned, and idle cash projection
      description: |
        Returns the user's vault status. Interest compounds daily and is accrued lazily on every read or mutation:
        balance × (1 + APY)^(elapsed_days/365).
      operationId: getVault
      tags: [Vault]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The vault status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
              example:
                balance: 20000.00
                apy: 0.051
                interest_earned_total: 0.00
                projected_monthly_interest_on_idle_cash: 335.34
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /vault/deposits:
    post:
      summary: Deposit uninvested cash into the vault
      description: |
        Transfers cash from buying power into the vault. Accrues pending interest first.
      operationId: depositVault
      tags: [Vault]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultTransferRequest" }
            example: { amount: 20000.00 }
      responses:
        "201":
          description: Deposited successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultTransaction" }
              example:
                id: 1
                type: DEPOSIT
                amount: 20000.00
                created_at: "2026-11-08T09:41:00Z"
        "400":
          description: Amount is non-positive or has more than 2 decimal places.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "amount must be positive with at most 2 decimals", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Amount exceeds buying power.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "insufficient buying power", code: INSUFFICIENT_FUNDS }

  /vault/withdrawals:
    post:
      summary: Withdraw cash from the vault back to cash balance
      description: |
        Transfers cash from the vault back to uninvested cash. Accrues pending interest first.
      operationId: withdrawVault
      tags: [Vault]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultTransferRequest" }
            example: { amount: 5000.00 }
      responses:
        "201":
          description: Withdrawn successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultTransaction" }
              example:
                id: 2
                type: WITHDRAWAL
                amount: 5000.00
                created_at: "2026-11-08T09:42:00Z"
        "400":
          description: Amount is non-positive or has more than 2 decimal places.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "amount must be positive with at most 2 decimals", code: VALIDATION_ERROR }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Amount exceeds vault balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "insufficient vault balance", code: INSUFFICIENT_VAULT_BALANCE }

  /vault/transactions:
    get:
      summary: List the signed-in user's vault transactions
      description: |
        Lists the user's deposits and withdrawals newest first.
      operationId: listVaultTransactions
      tags: [Vault]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The list of vault transactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultTransactionListResponse" }
              example:
                items:
                  - id: 2
                    type: WITHDRAWAL
                    amount: 5000.00
                    created_at: "2026-11-08T09:42:00Z"
                  - id: 1
                    type: DEPOSIT
                    amount: 20000.00
                    created_at: "2026-11-08T09:41:00Z"
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /leaderboard:
    get:
      summary: Public leaderboard ranked by return or Sharpe ratio
      description: |
        Materialized rankings refreshed every LEADERBOARD_REFRESH (story NW-13).
        metric=return ranks all opted-in users by total_return_pct.
        metric=sharpe ranks only users with sufficient data by sharpe_ratio.
        Ties are broken by earlier opted_in_at.
      operationId: getLeaderboard
      tags: [Leaderboard]
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: metric
          in: query
          required: true
          description: Ranking metric.
          schema:
            $ref: "#/components/schemas/LeaderboardMetric"
          example: return
        - name: limit
          in: query
          required: false
          description: Maximum entries to return (1–100, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Ranked leaderboard entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaderboardPage" }
        "400":
          $ref: "#/components/responses/ValidationError"

  /ai/ask:
    post:
      summary: Ask a question answered by the knowledge base with citations
      description: |
        Answers a trading question using retrieval-augmented generation over TradeEdu knowledge base articles.
        If no relevant chunks are found, returns an abstain answer without calling the LLM.
      operationId: askKnowledge
      tags: [AI]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: Answer with citations or abstain response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
              example:
                answer: "Slippage is the difference between the expected price and the execution price."
                citations:
                  - article_slug: slippage
                    article_title: "Slippage: Why Orders Fill Off-Price"
                    chunk_id: slippage-what-is-slippage
                    quoted_text: "Slippage is the difference between expected price of a trade and the price at which the trade is executed."
                model: fake
                disclaimer: "AI-generated · educational, not financial advice"
        "400":
          description: Question is empty or exceeds 500 characters.
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/AIRefused"
        "429":
          $ref: "#/components/responses/AIBudgetExceeded"
        "503":
          $ref: "#/components/responses/AIUnavailable"

  /learn/articles:
    get:
      summary: List all knowledge base articles
      description: Returns summaries and tags of all knowledge base articles. Public and unauthenticated.
      operationId: listArticles
      tags: [Learn]
      security: []
      responses:
        "200":
          description: List of articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleListResponse" }
              example:
                items:
                  - slug: slippage
                    title: "Slippage: Why Orders Fill Off-Price"
                    summary: "How execution latency and volume affect order fill prices."
                    tags: [execution, risk]

  /learn/articles/{slug}:
    get:
      summary: Get one article by slug
      description: Returns the full article including markdown body and update timestamp.
      operationId: getArticle
      tags: [Learn]
      security: []
      parameters:
        - $ref: "#/components/parameters/ArticleSlug"
      responses:
        "200":
          description: Full article details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "404":
          $ref: "#/components/responses/ArticleNotFound"

  /learn/search:
    get:
      summary: Search knowledge base articles using full-text search
      description: Performs full-text search across article chunks with ranking and headline snippets.
      operationId: searchArticles
      tags: [Learn]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Search query. Cannot be blank.
      responses:
        "200":
          description: Matching article chunks ordered by relevance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleSearchResponse" }
              example:
                items:
                  - slug: slippage
                    title: "Slippage: Why Orders Fill Off-Price"
                    chunk_id: slippage-what-is-slippage
                    snippet: "<b>Slippage</b> is the difference between the expected price and executed price."
        "400":
          description: Query parameter q is empty or blank.
          $ref: "#/components/responses/ValidationError"
