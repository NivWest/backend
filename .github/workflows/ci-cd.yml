name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build ./cmd/api

      - name: Validate Compose configuration
        run: docker compose config

  image:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Google Compute Engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Compose file
        run: |
          gcloud compute scp docker-compose.yml \
            "${{ vars.GCE_USER }}@${{ vars.GCE_INSTANCE }}:/tmp/nivwest-docker-compose.yml" \
            --zone="${{ vars.GCE_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy on VM
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_ENV: |
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_TAG=${{ github.sha }}
            APP_ENV_FILE=/opt/nivwest/.env
            POSTGRES_DATA_DIR=/var/lib/nivwest/postgres
            SERVER_HOST=0.0.0.0
            SERVER_PORT=8080
            DB_HOST=postgres
            DB_PORT=5432
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_SSLMODE=${{ vars.DB_SSLMODE || 'disable' }}
            DB_MAX_IDLE_CONNS=10
            DB_MAX_OPEN_CONNS=100
            AVANZA_TIMEOUT=10s
        run: |
          deploy_env_b64="$(printf '%s' "$DEPLOY_ENV" | base64 -w 0)"
          ghcr_token_b64="$(printf '%s' "$GHCR_TOKEN" | base64 -w 0)"
          gcloud compute ssh \
            "${{ vars.GCE_USER }}@${{ vars.GCE_INSTANCE }}" \
            --zone="${{ vars.GCE_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --command="DEPLOY_ENV_B64='$deploy_env_b64' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN_B64='$ghcr_token_b64' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          sudo mkdir -p /opt/nivwest /var/lib/nivwest/postgres
          sudo mv /tmp/nivwest-docker-compose.yml /opt/nivwest/docker-compose.yml
          printf '%s' "$DEPLOY_ENV_B64" | base64 -d | sudo tee /opt/nivwest/.env >/dev/null
          sudo chmod 600 /opt/nivwest/.env
          ghcr_token="$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)"

          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sudo sh
          fi

          if ! sudo docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi

          sudo docker compose version >/dev/null 2>&1

          printf '%s' "$ghcr_token" | sudo docker login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin
          cd /opt/nivwest
          sudo docker compose pull api
          sudo docker compose up -d --remove-orphans
          sudo docker compose ps --status running --services | grep -qx api
          sudo docker image prune -af --filter "until=168h"
          REMOTE_SCRIPT