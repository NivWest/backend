name: Agent task
description: A task under a Jira-linked issue that can be delegated to Jules.
title: "[task] "
body:
  - type: markdown
    attributes:
      value: |
        Create this as a **sub-issue** of the Jira-linked issue (`SCRUM-xx: …`) and describe the outcome you want.
        Jules reads the code, the repo docs and the user story in the parent issue, and works out the files,
        the acceptance criteria and the tests itself. Add the `agent-delegate` label to hand it to Jules.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should change, in a sentence or two.
      placeholder: Reject blank or over-long watchlist names with a 422 instead of saving them.
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Hints
      description: Optional. Only what Jules can't find in the code, such as a known pitfall or something not to touch.
    validations:
      required: false
