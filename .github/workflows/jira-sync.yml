name: Jira Sync

# Inbound: a Jira Automation rule sends a repository_dispatch when a ticket is
# created or reassigned; this upserts the matching "<KEY>: <summary>" issue.
# Outbound: closing that issue as completed transitions the Jira ticket to Done.

on:
  repository_dispatch:
    types: [jira-issue-sync, create_jira_issue]
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  inbound:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Upsert GitHub issue for Jira ticket
        uses: actions/github-script@v7
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          USER_MAP: ${{ vars.JIRA_USER_MAP }}
        with:
          script: |
            const p = JSON.parse(process.env.PAYLOAD);
            const { owner, repo } = context.repo;
            const key = String(p.key || '').trim();
            if (!/^[A-Z][A-Z0-9]+-\d+$/.test(key)) {
              core.setFailed(`Invalid Jira key in payload: "${key}"`);
              return;
            }

            let userMap = {};
            try {
              userMap = JSON.parse(process.env.USER_MAP || '{}');
            } catch {
              core.warning('JIRA_USER_MAP is not valid JSON; issue will be unassigned.');
            }
            const login = userMap[p.assignee_account_id] || userMap[p.assignee_email];
            const assignees = login ? [login] : [];

            const title = `${key}: ${p.summary || ''}`.slice(0, 256);
            const body = [
              p.description || '_No description in Jira._',
              '',
              '---',
              `**Jira:** ${p.url || key}`,
              p.issue_type ? `**Type:** ${p.issue_type}` : '',
              '',
              '_Break this ticket down into sub-issues using the **Agent task** form. ' +
                'Add the `agent-delegate` label to a sub-issue to hand it to Jules._',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'jira', state: 'all', per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title.startsWith(`${key}:`));

            if (existing) {
              // Keep the body: people may have edited it after the first sync.
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title,
                ...(login ? { assignees } : {}),
              });
              core.notice(`Updated #${existing.number} for ${key}`);
            } else {
              const { data } = await github.rest.issues.create({
                owner, repo, title, body, labels: ['jira'], assignees,
              });
              core.notice(`Created #${data.number} for ${key}`);
            }

  outbound:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state_reason == 'completed' &&
      contains(github.event.issue.labels.*.name, 'jira')
    runs-on: ubuntu-latest
    steps:
      - name: Transition Jira ticket to Done
        env:
          TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DONE_TRANSITION: ${{ vars.JIRA_DONE_TRANSITION || 'Done' }}
        run: |
          set -euo pipefail
          if [ -z "${JIRA_API_TOKEN:-}" ] || [ -z "${JIRA_BASE_URL:-}" ]; then
            echo "::warning::Jira secrets are not configured; skipping."
            exit 0
          fi
          key=$(printf '%s' "$TITLE" | grep -oE '^[A-Z][A-Z0-9]+-[0-9]+' || true)
          if [ -z "$key" ]; then
            echo "::warning::No Jira key at the start of the issue title; skipping."
            exit 0
          fi

          api="${JIRA_BASE_URL%/}/rest/api/3/issue/$key"
          auth=(-u "$JIRA_USER:$JIRA_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json')

          transition_id=$(curl -fsS "${auth[@]}" "$api/transitions" | jq -r --arg n "$DONE_TRANSITION" '
            .transitions[]
            | select((.name | ascii_downcase) == ($n | ascii_downcase) or (.to.name | ascii_downcase) == ($n | ascii_downcase))
            | .id' | head -n1)
          if [ -z "$transition_id" ]; then
            echo "::warning::No '$DONE_TRANSITION' transition available for $key from its current status."
          else
            jq -n --arg id "$transition_id" '{transition: {id: $id}}' \
              | curl -fsS "${auth[@]}" -X POST "$api/transitions" -d @-
            echo "Transitioned $key to $DONE_TRANSITION"
          fi

          jq -n --arg url "$ISSUE_URL" '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [
              {type: "text", text: "GitHub issue completed: "},
              {type: "text", text: $url, marks: [{type: "link", attrs: {href: $url}}]}]}]}}' \
            | curl -fsS "${auth[@]}" -X POST "$api/comment" -d @- > /dev/null
