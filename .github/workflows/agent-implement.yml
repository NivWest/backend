name: Agent Implement

# A human adds the `agent-delegate` label to a sub-issue (Agent task form) of a
# Jira-linked issue. The gate checks the Definition of Ready, then Jules
# implements the task and opens a PR against dev.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.label.name == 'agent-delegate'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      jira_key: ${{ steps.check.outputs.jira_key }}
      jira_url: ${{ steps.check.outputs.jira_url }}
      parent_title: ${{ steps.check.outputs.parent_title }}
      parent_url: ${{ steps.check.outputs.parent_url }}
      goal: ${{ steps.check.outputs.goal }}
      paths: ${{ steps.check.outputs.paths }}
      acceptance: ${{ steps.check.outputs.acceptance }}
      verification: ${{ steps.check.outputs.verification }}
      out_of_scope: ${{ steps.check.outputs.out_of_scope }}
    steps:
      - name: Check Definition of Ready
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const body = issue.body || '';

            // Issue forms render each field as "### <Label>\n\n<value>".
            function section(label) {
              const re = new RegExp(`^###\\s+${label}\\s*$([\\s\\S]*?)(?=^###\\s|(?![\\s\\S]))`, 'm');
              const text = (body.match(re)?.[1] || '').replace(/^```\w*\s*$/gm, '').trim();
              return text === '_No response_' ? '' : text;
            }
            const fields = {
              goal: section('Goal'),
              paths: section('Target paths'),
              acceptance: section('Acceptance criteria'),
              verification: section('Verification'),
              out_of_scope: section('Out of scope'),
            };

            const missing = [];
            for (const [name, label] of [['goal', 'Goal'], ['paths', 'Target paths'],
                                         ['acceptance', 'Acceptance criteria'], ['verification', 'Verification']]) {
              if (!fields[name]) missing.push(`**${label}** is empty. Use the **Agent task** issue form.`);
            }

            let parent = null;
            try {
              ({ data: parent } = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/parent', {
                owner, repo, issue_number: issue.number,
              }));
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const jiraKey = parent?.title.match(/^([A-Z][A-Z0-9]+-\d+)\b/)?.[1] || '';
            if (!parent) {
              missing.push('This issue is not a **sub-issue**. Add it as a sub-issue of the Jira-linked issue (`SCRUM-xx: …`).');
            } else if (!jiraKey) {
              missing.push(`Parent issue ${parent.html_url} has no Jira key at the start of its title.`);
            }

            if (missing.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  '🤖 Not delegated to Jules. This task does not meet the Definition of Ready yet:',
                  '',
                  ...missing.map(m => `- ${m}`),
                  '',
                  'Fix the above, then add the `agent-delegate` label again.',
                ].join('\n'),
              });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'agent-delegate',
              }).catch(() => {});
              core.setOutput('ready', 'false');
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const closes = new RegExp(`\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#${issue.number}\\b`, 'i');
            const existing = pulls.find(p => p.user.login === 'google-labs-jules[bot]' && closes.test(p.body || ''));
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🤖 Not delegated again: Jules already has an open PR for this task (#${existing.number}).`,
              });
              core.setOutput('ready', 'false');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `🤖 Delegated to Jules for \`${jiraKey}\`. Jules will open a PR against \`dev\` that closes this issue.`,
            });

            core.setOutput('ready', 'true');
            core.setOutput('jira_key', jiraKey);
            core.setOutput('jira_url', parent.body?.match(/\*\*Jira:\*\*\s*(\S+)/)?.[1] || jiraKey);
            core.setOutput('parent_title', parent.title);
            core.setOutput('parent_url', parent.html_url);
            for (const [name, value] of Object.entries(fields)) core.setOutput(name, value || 'None');

  implement:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: dev
          prompt: |
            You are working on the NivWest backend — a Go API using Gin, GORM, and PostgreSQL.

            ## Context
            - Jira ticket: ${{ needs.gate.outputs.jira_key }} (${{ needs.gate.outputs.jira_url }})
            - Parent issue: ${{ needs.gate.outputs.parent_title }} (${{ needs.gate.outputs.parent_url }})
            - Your task: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}

            ## Goal
            ${{ needs.gate.outputs.goal }}

            ## Target paths
            Only change files under these paths unless strictly required; explain any exception in the PR body.
            ${{ needs.gate.outputs.paths }}

            ## Acceptance criteria
            Every criterion must be covered by a test.
            ${{ needs.gate.outputs.acceptance }}

            ## Out of scope
            ${{ needs.gate.outputs.out_of_scope }}

            ## Instructions
            1. Read `AGENTS.md`, `doc/architecture.md` and `doc/workflow.md` before making changes, and follow them.
            2. Branch from `dev` as `jules/<type>/${{ needs.gate.outputs.jira_key }}-<short-slug>`
               where `<type>` is `feat`, `fix`, `refactor` or `chore`.
            3. Implement the change with tests that use the in-memory fakes from `internal/testutil`.
            4. Use Conventional Commits and end each subject with the Jira key,
               e.g. `fix(order): parse last price from quote [${{ needs.gate.outputs.jira_key }}]`.
            5. Run these and fix every failure before opening the PR:
               ${{ needs.gate.outputs.verification }}
            6. Open exactly one pull request targeting `dev`:
               - Title: `${{ needs.gate.outputs.jira_key }} <type>(<scope>): <summary>`
               - Body: summary of the change and design decisions, `Closes #${{ github.event.issue.number }}`,
                 `Jira: ${{ needs.gate.outputs.jira_url }}`, and confirmation that the checks above pass.
